name: Deploy Cloud Functions
# פריסה אוטומטית של פונקציות השרת של בקרת מנופים בכל שינוי בתיקיית functions (או ידנית: Run workflow).
# פורס רק את קבוצת הפונקציות crane-control — לא נוגע בפונקציות של מערכת התסקירים (scanCertificate),
# לא בחוקי האבטחה, לא בנתונים ולא באתר. בלי --force: לעולם לא מוחק פונקציות שאינן שלו.
# נדרש Secret בריפו: FIREBASE_SERVICE_ACCOUNT (קובץ ה-JSON של חשבון השירות)

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: firebase-deploy-crane-control
  cancel-in-progress: false

env:
  PROJECT: cranes-a0759

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: '[ -n "$SA" ] || { echo "::error::חסר Secret בשם FIREBASE_SERVICE_ACCOUNT בהגדרות הריפו"; exit 1; }'

      - name: Install
        run: |
          npm ci --prefix functions
          npm install -g firebase-tools

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy (crane-control codebase only)
        run: firebase deploy --only functions:crane-control --project "$PROJECT" --non-interactive
