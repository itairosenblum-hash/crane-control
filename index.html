<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ECEEF1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>בקרת מנופים</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-title" content="בקרת מנופים" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['"IBM Plex Sans Hebrew"', "system-ui", "sans-serif"] },
      colors: { ink: "#1D2633", muted: "#6B7584", concrete: "#ECEEF1", safety: "#F5B800" },
    } } };
  </script>
  <style type="text/tailwindcss">
    @layer base {
      html { -webkit-tap-highlight-color: transparent; }
      body { @apply font-sans bg-concrete text-ink antialiased; font-feature-settings: "tnum" 1; }
      :focus-visible { @apply outline-none ring-2 ring-ink/40 ring-offset-2 ring-offset-concrete; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    }
    @layer components {
      /* משטחים */
      .card { @apply bg-white rounded-[20px] p-4 shadow-[0_1px_2px_rgba(29,38,51,0.06)]; }
      .group-list { @apply bg-white rounded-[20px] overflow-hidden divide-y divide-slate-100 shadow-[0_1px_2px_rgba(29,38,51,0.06)]; }
      .page-title { @apply text-[28px] leading-tight font-bold tracking-tight text-ink; }
      .sec-title { @apply text-sm font-semibold text-muted px-1 mb-2; }
      .lbl { @apply block text-sm font-medium text-muted mb-1.5; }
      .inp { @apply w-full rounded-2xl border-0 bg-slate-100 px-4 py-3.5 text-lg text-ink placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-ink/20 focus:bg-white; }
      .inp-sm { @apply w-full rounded-xl border-0 bg-slate-100 px-3 py-2.5 text-sm text-ink placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-ink/20 focus:bg-white; }

      /* כפתורים */
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-2xl px-4 py-3 font-semibold transition select-none active:scale-[.98] active:opacity-90 disabled:opacity-40 disabled:pointer-events-none; }
      .btn-sm { @apply px-3.5 py-2 text-sm rounded-xl; }
      .btn-xl { @apply w-full h-14 text-lg rounded-2xl; }
      .btn-primary { @apply bg-ink text-white; }
      .btn-dark { @apply bg-ink text-white; }
      .btn-ghost { @apply bg-slate-100 text-ink; }
      .btn-danger { @apply bg-[#B42318] text-white; }
      .btn-success { @apply bg-[#E8F3EC] text-[#2F7D55]; }
      .icon-btn { @apply w-10 h-10 inline-flex items-center justify-center rounded-full text-ink hover:bg-slate-100 active:bg-slate-200; }

      /* תגיות */
      .badge { @apply inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold whitespace-nowrap; }
      .badge-ok { @apply bg-[#E8F3EC] text-[#2F7D55]; }
      .badge-warn { @apply bg-[#FDF1DC] text-[#8A5300]; }
      .badge-crit { @apply bg-[#FDE8E6] text-[#B42318]; }

      /* תקין / לא תקין */
      .tgl { @apply min-w-[4.75rem] rounded-full bg-slate-100 px-3.5 py-2 text-sm font-semibold text-muted transition; }
      [data-value="1"] .tgl[data-val="1"] { @apply bg-[#2F7D55] text-white; }
      [data-value="0"] .tgl[data-val="0"] { @apply bg-[#B42318] text-white; }

      /* צ'קליסט סגירה */
      .chk { @apply w-full flex items-center gap-3 px-4 min-h-[60px] text-[17px] font-medium text-ink bg-white transition; }
      .chk .box { @apply w-7 h-7 shrink-0 rounded-full border-2 border-slate-300 flex items-center justify-center text-transparent text-sm; }
      .chk[aria-pressed="true"] .box { @apply bg-[#2F7D55] border-[#2F7D55] text-white; }

      .crane-opt { @apply rounded-2xl bg-slate-100 p-4 text-center transition; }
      .crane-opt[aria-pressed="true"] { @apply bg-ink text-white; }

      /* בורר חומרה */
      .seg { @apply inline-flex gap-0.5 rounded-full bg-slate-100 p-1; }
      .seg-btn { @apply px-3 py-1.5 rounded-full text-sm font-semibold text-muted transition; }
      .seg-btn[aria-pressed="true"][data-sev="off"] { @apply bg-white text-ink shadow-sm; }
      .seg-btn[aria-pressed="true"][data-sev="warning"] { @apply bg-white text-[#8A5300] shadow-sm; }
      .seg-btn[aria-pressed="true"][data-sev="critical"] { @apply bg-white text-[#B42318] shadow-sm; }

      /* אחוזי דלק / אוראה */
      .lvl { @apply rounded-xl bg-slate-100 py-3 text-[17px] font-semibold text-ink transition; }
      .lvl.lvl-warn { @apply text-[#8A5300]; }
      .lvl.lvl-crit { @apply text-[#B42318]; }
      .lvl[aria-pressed="true"] { @apply bg-ink text-white; }
      .lvl.lvl-warn[aria-pressed="true"] { @apply bg-[#8A5300] text-white; }
      .lvl.lvl-crit[aria-pressed="true"] { @apply bg-[#B42318] text-white; }

      /* סרגל לשוניות תחתון */
      .tab { @apply flex flex-col items-center justify-center gap-0.5 pt-2 pb-1.5 text-[11px] font-medium text-slate-400 transition; }
      .tab[aria-selected="true"] { @apply text-ink; }
      .tab[aria-selected="true"] svg { @apply stroke-[2.2]; }

      .th { @apply text-right font-medium text-muted text-xs px-3 py-2.5 border-b border-slate-100 whitespace-nowrap; }
      .td { @apply px-3 py-2.5 border-b border-slate-100 align-top text-sm; }

      /* גיליון תחתון */
      .sheet { @apply bg-white w-full max-w-md rounded-t-[28px] sm:rounded-[28px] px-5 pt-3 shadow-2xl; padding-bottom: calc(env(safe-area-inset-bottom) + 20px); animation: sheet-up .22s cubic-bezier(.2,.8,.2,1); }
      .sheet::before { content: ""; @apply block w-10 h-1.5 rounded-full bg-slate-200 mx-auto mb-4; }
    }
    @keyframes sheet-up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="min-h-screen flex items-center justify-center">
      <div class="w-8 h-8 border-[3px] border-slate-300 border-t-ink rounded-full animate-spin"></div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed top-[68px] inset-x-0 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

  <script type="module" src="js/ui.js?v=202611091002"></script>
</body>
</html>
